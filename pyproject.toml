[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemm-ip-gen"
version = "0.2.0"
description = "GEMM IP package generator for the Catapult HLS backend"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"targets.tensor_slice" = ["*.v"]
"targets.cmvu" = ["rtl_static/*.sv", "rtl_static/*.txt"]
